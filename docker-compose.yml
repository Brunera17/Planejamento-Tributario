services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planejador
      POSTGRES_PASSWORD: planejador
      POSTGRES_DB: planejador
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planejador"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # noeviction: com Redis cheio, recusa gravar em vez de apagar sessões sozinho
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://planejador:planejador@db:5432/planejador
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-segredo-local-do-docker-compose-nao-usar-em-producao}
      # chave pública de desenvolvimento (a mesma do config.py): só para rodar local; produção usa a sua
      CHAVE_ARQUIVOS: ${CHAVE_ARQUIVOS:-ZGVzZW52b2x2aW1lbnRvLXNvbWVudGUtbmFvLXVzYXI=}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:5173
    # local: com os usuários e planejamentos de demonstração
    command: ["sh", "-c", "alembic upgrade head && python -m app.seeds.carga --demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
  redisdata:
