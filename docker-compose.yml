services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planejador
      POSTGRES_PASSWORD: planejador
      POSTGRES_DB: planejador
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planejador"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://planejador:planejador@db:5432/planejador
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-desenvolvimento-32c}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
