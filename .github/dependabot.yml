# Um PR por ecossistema, uma vez por mês: todas as atualizações juntas num só (grupo "todas").
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    # requirements.in tem os pisos (>=) e requirements.txt é o lock (uv pip compile): o PR atualiza o lock
    open-pull-requests-limit: 2
    groups:
      todas:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # versões principais entram numa migração planejada, não por PR solto
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      todas:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      todas:
        patterns: ["*"]
