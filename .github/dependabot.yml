version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # versões principais (React 19, TypeScript 7, vite/vitest novos) entram numa migração planejada, não por PR solto
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # react e react-dom sempre juntos (versões separadas quebram a tela)
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
