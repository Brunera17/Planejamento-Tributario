# Um PR por ecossistema, uma vez por mês: todas as atualizações juntas num só (grupo "todas").
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    # o requirements usa ">=": o CI já instala a versão mais nova, o PR só sobe o piso
    open-pull-requests-limit: 2
    groups:
      todas:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # versões principais entram numa migração planejada, não por PR solto
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      todas:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      todas:
        patterns: ["*"]
