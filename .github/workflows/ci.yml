name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# um commit novo no mesmo branch/PR cancela a execução anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-testes:
    name: Backend · testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # conftest.py já usa SQLite em memória e fakeredis: não precisa de serviços
      - run: python -m pytest -q

  backend-migrations:
    name: Backend · migrations no Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planejador
          POSTGRES_PASSWORD: planejador
          POSTGRES_DB: planejador
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planejador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://planejador:planejador@localhost:5432/planejador
      REDIS_URL: redis://localhost:6379/0
      # só para passar na validação de produção do Settings (Postgres exige segredo ≥ 32 caracteres)
      JWT_SECRET: ci-segredo-descartavel-somente-para-o-workflow-0123456789
      UPLOAD_DIR: /tmp/planejador-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      # o mesmo que o Render faz ao subir, num banco vazio
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: Carga inicial com demonstração
        run: python -m app.seeds.carga --demo
      # models × migrations; começa como aviso até confirmar que não há divergência antiga
      - name: alembic check
        run: alembic check
        continue-on-error: true

  frontend:
    name: Frontend · tipos, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build  # tsc -b + vite build
      - run: npm test

  docker:
    name: Docker · ${{ matrix.imagem }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        imagem: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.imagem }}
          push: false
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}
