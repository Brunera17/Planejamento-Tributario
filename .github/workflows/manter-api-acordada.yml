# Mantém a API acordada: o Render grátis a põe para dormir após 15 min sem acesso, e acordar leva ~30 s.
# A cada 5 min (o mínimo do GitHub): o agendamento pode atrasar ou pular uma rodada e ainda sobra folga até os 15.
# O GitHub desliga agendamentos de repositório público sem atividade por 60 dias: um commit religa.
name: Manter API acordada

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # cabe 3 tentativas de 120 s
    steps:
      - name: GET /api/saude
        # pelo rewrite da Vercel (frontend/vercel.json): se o endereço do Render mudar, este acesso acompanha.
        # Falhar aqui avisa por e-mail: API fora do ar ou Redis indisponível (o /api/saude responde 200 nos dois casos
        # em que está no ar, com o estado do Redis no corpo)
        run: |
          corpo=$(curl -fsS --retry 2 --retry-delay 10 -m 120 -w "\n%{time_total}" https://planejamento-tributario-eta.vercel.app/api/saude)
          echo "$corpo"
          echo "$corpo" | grep -q '"redis":"ok"' || { echo "::error::Redis indisponível"; exit 1; }
