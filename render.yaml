# Blueprint do Render: API (Docker) no plano grátis. Banco no Neon, arquivos no Google Drive (cifrados).
# Plano: docs/PLANO_Deploy_Render_Neon_Drive.md. No Render: New > Blueprint > este repositório.
# Preencha no painel as variáveis com sync: false. O plano grátis dorme após 15 min sem acesso (o primeiro volta em ~1 min).
services:
  - type: web
    name: planejador-api
    runtime: docker
    rootDir: backend
    region: virginia  # ao lado do banco no Neon (aws-us-east-1): cada consulta ao banco fica a ~1 ms
    plan: free  # sem disco persistente: os arquivos vão para o Drive (ARMAZENAMENTO=drive)
    healthCheckPath: /api/saude  # sempre 200; o /openapi.json fica desligado em produção
    autoDeployTrigger: checksPass  # só publica depois que o CI do GitHub passar no commit
    envVars:
      # Neon: a URL direta (sem "-pooler" no host), com sslmode=require. 1 processo x pool 5+5 cabe no plano grátis.
      - key: DATABASE_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"  # 512 MB de memória no plano grátis: um processo só
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: planejador-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # chave mestra dos arquivos cifrados: gere com `python -m app.services.cripto --gerar-chave` e GUARDE UMA
      # CÓPIA FORA DO RENDER (gerenciador de senhas do escritório). Perder a chave = perder todos os documentos.
      - key: CHAVE_ARQUIVOS
        sync: false
      - key: ACEITAR_ARQUIVO_SEM_CIFRA
        value: "false"  # instalação nova: nenhum arquivo antigo em texto puro
      # Google Drive: rode `python -m app.services.armazenamento --autorizar` no computador (com DRIVE_CLIENT_ID e
      # DRIVE_CLIENT_SECRET no .env); ele imprime o DRIVE_REFRESH_TOKEN e o DRIVE_PASTA_ID. Guarde cópia fora do Render.
      - key: ARMAZENAMENTO
        value: drive
      - key: DRIVE_CLIENT_ID
        sync: false
      - key: DRIVE_CLIENT_SECRET
        sync: false
      - key: DRIVE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_PASTA_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false  # vazio com o proxy da Vercel (mesma origem); só se a tela chamar a API direto
      - key: ORIGEM_PUBLICA
        value: https://planejamento-tributario.domingosassessoria.com.br
      - key: IP_POR_X_FORWARDED_FOR
        value: "true"  # o Render acrescenta o IP real; sem isso, todos aparecem com o IP do proxy
      - key: PROXIES_CONFIAVEIS
        sync: false  # faixas do proxy da Vercel, se ela aparecer como último salto (conferir no deploy)
      - key: ADMIN_USUARIO
        sync: false
      - key: ADMIN_SENHA
        sync: false  # pelo menos 12 caracteres; só vale para criar o primeiro usuário
      - key: ADMIN_NOME
        sync: false

  # Redis (Key Value) das sessões. Gratuito e sem persistência: um reinício desloga todos (decisão D3).
  - type: keyvalue
    name: planejador-redis
    region: virginia  # a mesma da API: a rede interna do Render só liga serviços da mesma região
    plan: free
    ipAllowList: []  # só a rede interna do Render
    maxmemoryPolicy: noeviction  # nunca apagar sessões sozinho

